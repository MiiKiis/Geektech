version: '3.8'

services:
  db_geektech:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-geektech_db}
      POSTGRES_USER: ${DB_USER:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    deploy:
      resources:
        limits:
          memory: 256M # Muy ligero para no quitarle RAM al WoW

  web_geektech:
    build: .
    container_name: nextjs_web
    restart: always
    ports:
      - "3001:3000" # Usamos el 3001 para que no choque con nada
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD}@db_geektech:5432/${DB_NAME:-geektech_db}
      ADMIN_SECRET_TOKEN: ${ADMIN_SECRET_TOKEN}
    depends_on:
      - db_geektech
    deploy:
      resources:
        limits:
          memory: 512M # Límite de seguridad para tu servidor
    volumes:
      - ./uploads:/app/public/uploads # Aquí se guardarán tus fotos mágicamente
